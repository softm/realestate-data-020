name: Collect regional transactions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, backfill, refresh, build, bootstrap]
        default: auto
        description: 'Resume verified checkpoints and incomplete pages within existing request budgets'
  schedule:
    - cron: '59 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  regional:
    uses: softm/softm.tojihannun/.github/workflows/collection-worker.yml@839c2a8c27877fb8af526e42961abdadd34d7fd6
    with:
      engine_ref: 839c2a8c27877fb8af526e42961abdadd34d7fd6
      mode: ${{ inputs.mode || 'auto' }}
    secrets:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
