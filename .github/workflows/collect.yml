name: Collect regional transactions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, backfill, refresh, build, bootstrap]
        default: auto
        description: 'Resume verified checkpoints and incomplete pages within existing request budgets'
  schedule:
    - cron: '59 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  regional:
    uses: softm/softm.tojihannun/.github/workflows/collection-worker.yml@e0a6d91af669ff13d0986ce60da11f681cefb694
    with:
      engine_ref: e0a6d91af669ff13d0986ce60da11f681cefb694
      mode: ${{ inputs.mode || 'auto' }}
    secrets:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}

