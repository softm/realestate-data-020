name: Collect regional transactions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, backfill, refresh, build, bootstrap]
        default: auto
        description: 'Resume verified checkpoints and incomplete pages within existing request budgets'
  schedule:
    - cron: '59 * * * *'
    - cron: '29 * * * *'
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
jobs:
  regional:
    uses: softm/softm.tojihannun/.github/workflows/collection-worker.yml@4ea284af863f97312a4c1f5d956fcfc14eb29c31
    with:
      engine_ref: 4ea284af863f97312a4c1f5d956fcfc14eb29c31
      mode: ${{ inputs.mode || 'auto' }}
    secrets:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}

