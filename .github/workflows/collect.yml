name: Collect regional transactions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [auto, backfill, refresh, refresh-year, audit-history, build, bootstrap]
        default: auto
        description: 'Resume checkpoints, refresh recent data, or run scheduled historical verification'
  schedule:
    - cron: '20 * * * *'
    - cron: '50 3 * * 1'
    - cron: '50 4 1 * *'
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
jobs:
  regional:
    uses: softm/softm.tojihannun/.github/workflows/collection-worker.yml@0a94be9ac51a17b0b054bf410599759b21415479
    with:
      engine_ref: 0a94be9ac51a17b0b054bf410599759b21415479
      mode: ${{ github.event_name == 'push' && 'build' || github.event_name == 'schedule' && github.event.schedule == '50 3 * * 1' && 'refresh-year' || github.event_name == 'schedule' && github.event.schedule == '50 4 1 * *' && 'audit-history' || inputs.mode || 'auto' }}
    secrets:
      MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}